map_server:
    ros__parameters:
        yaml_filename: ''
planner_server:
    ros__parameters:
        expected_planner_frequency: 2.0
        planner_plugins:
        - SentryMinco
        SentryMinco:
            plugin: SentryMincoPlanner
            obs_cloud_buffer_frame: 20
            rate: 100
            odom_timeout: 0.5
            command_timeout: 0.5
            reach_thresh: 0.25
            end_dis: 0.5
            slow_down_pow: 2.0
            rotate_feedforward: 0.62
            back_distance: 1.5
            MapBound:
            - -25.0
            - 25.0
            - -25.0
            - 25.0
            - 0.0
            - 0.1
            vehicle_size: 0.8
            perception_size: 2.5
            globalPlanner:
                PreMapPath: 701_navigation.png
                PreCrossPath: 701_navigation.png
                PreDeepPath: new_701_deep.png
                resolution: 0.1
                obs_low: 0.25
                obs_high: 0.6
                gray_low: 0.0
                gray_high: 0.8
                dilate_radius: 0.35
                esdf_update_box_half_size: 4.0
                esdf_search_radius: 0.25
                interupt_path_min_length: 3.0
                robot_pixel_size: 4
                back_goal_search_grid_num: 10
            chassisDirectionController:
                Kp: 2.0
                Ki: 0.0
                Kd: 0.6
                dt: 0.01
                max_wz: 1200.0
                reach_thresh: 0.025
            SFCgenerator:
                progress: 5.0
                range: 1.0
                eps: 1e-4
                min_overlap_area: 0.001
            velocityTracker:
                dt: 0.005
                tracker_coef: 1e5
                max_dv: 5e5
                planar_max_acc: 50000.0
                planar_lpf_hz: 20.0
                planar_stop_speed: 30.0
                omega: 4.71239
                offset: 1000.0
                size: 150.0
                slow_offset: 700.0
                slow_size: 0.0
                sigma: 0.1
                window_size: 20
                pre_hz: 1.5
            localOptimizer:
                MaxVelMag: 3.5
                MaxBdrMag: 4.0
                MaxTiltAngle: 0.1
                MinThrust: 0.0
                MaxThrust: 400.0
                VehicleMass: 25.6
                GravAcc: 9.8
                HorizDrag: 0.7
                VertDrag: 0.8
                ParasDrag: 0.01
                SpeedEps: 0.0001
                WeightT: 1.0
                ChiVec:
                - 1000000.0
                - 1.0
                - 0.0
                - 0.0
                - 0.0
                DistanceCostThreshold: 0.1
                DistanceCostWeight: 50.0
                SmoothingEps: 0.001
                IntegralIntervs: 128
                RelCostTol: 1e-3
controller_server:
    ros__parameters:
        controller_frequency: 100.0
        odom_topic: /navigation_odom
        min_x_velocity_threshold: 0.001
        min_y_velocity_threshold: 0.001
        min_theta_velocity_threshold: 0.001
        failure_tolerance: 0.5
        progress_checker_plugin: progress_checker
        goal_checker_plugins:
        - goal_checker
        controller_plugins:
        - FollowPath
        progress_checker:
            plugin: nav2_controller::SimpleProgressChecker
            required_movement_radius: 0.05
            movement_time_allowance: 15.0
        goal_checker:
            plugin: nav2_controller::SimpleGoalChecker
            stateful: true
            xy_goal_tolerance: 0.25
            yaw_goal_tolerance: 3.15
        FollowPath:
            plugin: pb_omni_pid_pursuit_controller::OmniPidPursuitController
            translation_kp: 6.0
            translation_ki: 0.0
            translation_kd: 0.0
            enable_rotation: false
            use_rotate_to_heading: false
            use_velocity_scaled_lookahead_dist: true
            lookahead_time: 0.5
            min_lookahead_dist: 0.2
            max_lookahead_dist: 0.6
            use_interpolation: true
            v_linear_min: 0.0
            v_linear_max: 3.5
            min_approach_linear_velocity: 0.03
            approach_velocity_scaling_dist: 0.6
            curvature_min: 0.1
            curvature_max: 0.7
            reduction_ratio_at_high_curvature: 0.2
            curvature_forward_dist: 0.5
            curvature_backward_dist: 0.2
            max_velocity_scaling_factor_rate: 1.5
bt_navigator:
    ros__parameters:
        global_frame: map
        robot_base_frame: vehicle
        odom_topic: /navigation_odom
        bt_loop_duration: 10
        default_server_timeout: 100
        plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_rate_controller_bt_node
        - nav2_pipeline_sequence_bt_node
global_costmap:
    global_costmap:
        ros__parameters:
            global_frame: map
            robot_base_frame: vehicle
            update_frequency: 10.0
            publish_frequency: 2.0
            resolution: 0.1
            robot_radius: 0.48
            track_unknown_space: true
            plugins:
            - static_layer
            static_layer:
                plugin: nav2_costmap_2d::StaticLayer
                map_subscribe_transient_local: true
            always_send_full_costmap: true
            rolling_window: false
local_costmap:
    local_costmap:
        ros__parameters:
            global_frame: map
            robot_base_frame: vehicle
            update_frequency: 10.0
            publish_frequency: 2.0
            resolution: 0.1
            robot_radius: 0.48
            track_unknown_space: true
            plugins:
            - static_layer
            static_layer:
                plugin: nav2_costmap_2d::StaticLayer
                map_subscribe_transient_local: true
            always_send_full_costmap: true
            rolling_window: true
            width: 6
            height: 6
